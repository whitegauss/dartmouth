# Copy to config.yaml with `dm init`, then edit.
# Full reference: docs/configuration.md
meeting:
  name: requirements
  purpose: Decide the requirements for an always-on personal agent server
  topics:
    - What data do I have, and how much?
    - Software layout on Linux and required capacity
    # A topic can carry its own premise, participant list, and chair:
    # - title: Where should each job run?
    #   premise: Monthly budget is about $10
    #   participants: [claude, gemini]   # the chair always attends
  # Background material passed to every turn.
  # Items with `private: true` go only to participants with share_scope: all.
  # Inline <private>...</private>, <!-- private -->...<!-- /private -->, and lines
  # starting with [private] are also redacted for share_scope: public_only.
  context: []
  #  - file: notes/machines.md
  #  - file: notes/health.md
  #    private: true
  # Relay style: lighter models refine each other's answers over several rounds,
  # and a stronger chair only moderates and summarizes.
  critique_rounds: 2
  critique_parallel: false   # false: one speaker at a time, so each builds on the previous one (relay)
  chair_participates: false  # true: the chair also answers and critiques
  display: as_arrived        # or all_at_once
  auto_advance: true         # false: wait for /next after every round
budget:
  max_calls: 40
  max_chars_per_message: 3000
  max_rounds: 30
participants:
  chair:
    adapter: claude_code
    model: opus                # the chair is the one place a strong model pays off
    role: chair
    display_name: Chair
    timeout_s: 240
    tools: []
    persona_file: prompts/personas/chair.md   # used as the intro without calling the model
  claude:
    adapter: claude_code
    model: sonnet              # discussants: lighter, faster models in a relay
    # effort: medium           # low | medium | high | xhigh | max (passed to `claude --effort`)
    role: engineer
    display_name: Claude
    timeout_s: 180
    persona_file: prompts/personas/claude.md
    # tools: [Read, Grep, Glob, WebSearch, WebFetch]   # default (read-only, independent round only)
  gemini:
    adapter: gemini_api               # Gemini API; set GEMINI_API_KEY (Google AI Studio)
    model: gemini-3.5-flash-lite      # list models with `dm models gemini`
    share_scope: public_only          # free-tier content may be used by Google; keep private material away
    role: researcher
    display_name: Gemini
    timeout_s: 180
    persona_file: prompts/personas/gemini.md
    # Or through Antigravity CLI: adapter: antigravity_cli, model: gemini-4-hydrogen-medium
