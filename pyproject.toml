[project]
name = "dartmouth"
version = "0.1.0"
description = "Round-based meetings between AI coding agents and you, with automatic minutes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "agents", "llm", "claude-code", "orchestration", "meeting", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic>=2",
    "pyyaml>=6",
    "ruamel-yaml>=0.18",
    "textual>=0.80",
    "uvicorn>=0.54.0",
]

[project.scripts]
dartmouth = "dartmouth.cli:main"
dm = "dartmouth.cli:main"

[project.optional-dependencies]
kb = [
    "fastembed>=0.9.1",
    "numpy>=2.5.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
